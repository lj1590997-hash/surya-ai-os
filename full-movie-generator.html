
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surya AI Full Movie Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#fff;font-family:Arial,sans-serif;padding:18px}
main{max-width:800px;margin:auto}
h1{color:#9baaff}
p{line-height:1.6;color:#cbd2e2}
label{display:block;margin-top:16px;margin-bottom:7px;font-weight:bold}
input,textarea,select,button{width:100%;padding:13px;border-radius:9px;font-size:16px}
input,textarea,select{background:#20283a;color:#fff;border:1px solid #46516b}
textarea{min-height:100px}
button{border:0;background:#788aff;color:#101522;font-weight:bold;margin-top:12px}
#output{white-space:pre-wrap;overflow-wrap:anywhere;background:#20283a;padding:14px;border-radius:9px;margin-top:16px;line-height:1.6}
.scene{border:1px solid #46516b;border-radius:10px;padding:12px;margin-top:12px}
.small{font-size:13px;color:#aeb8ce}
</style>
</head>
<body>
<main>
<h1>🎬 Surya AI Full Movie Studio</h1>
<p>एक कहानी से 20–50 scene-by-scene cinematic prompts बनाएँ।</p>

<label>Movie का नाम</label>
<input id="title" value="The Dragon Kingdom">

<label>कहानी / Story</label>
<textarea id="story" placeholder="अपनी फिल्म की कहानी लिखें...">एक प्राचीन राज्य में नीली आँखों वाला विशाल काला ड्रैगन जागता है। एक युवा योद्धा राज्य को बचाने निकलता है। उसे विश्वासघात, जादुई शक्तियों और अंतिम युद्ध का सामना करना पड़ता है।</textarea>

<label>मुख्य किरदार का स्थायी विवरण</label>
<textarea id="character">A gigantic ancient dragon with obsidian-black scales, glowing electric-blue eyes, enormous six-meter wings, two curved horns, scar across the left cheek, smoke drifting from nostrils. Keep the exact same design in every scene.</textarea>

<label>कुल Scenes</label>
<select id="count">
<option value="20">20 Scenes</option>
<option value="30">30 Scenes</option>
<option value="40">40 Scenes</option>
<option value="50">50 Scenes</option>
</select>

<label>Video Format</label>
<select id="format">
<option value="16:9 landscape cinematic">16:9 — YouTube Movie</option>
<option value="9:16 vertical cinematic">9:16 — Shorts / Reels</option>
</select>

<button id="generate">🎥 पूरी फिल्म के Scene Prompts बनाएँ</button>
  
<label>🎭 Hero / दूसरा किरदार (वैकल्पिक)</label>
<textarea id="hero">A brave young warrior with shoulder-length dark hair, a small scar above the right eyebrow, dark leather armor, a deep red cloak, and a silver sword. Keep the same face, clothing, and proportions in every scene.</textarea>

<label>🎨 Character Reference / Continuity Notes</label>
<textarea id="continuity">Keep the dragon's black scales, glowing blue eyes, two curved horns, enormous wings, and scar on the left cheek identical in every scene. Keep the warrior's face, red cloak, armor, and silver sword consistent. Continue the story logically from the previous scene.</textarea>
  
<button id="copy">📋 सभी Prompts Copy करें</button>
<button id="download">⬇️ Prompts की TXT File बनाएँ</button>

<p class="small">यह टूल prompts बनाता है, वास्तविक वीडियो नहीं। हर scene का prompt बाहरी AI video generator में इस्तेमाल करें।</p>
<div id="output">आपके scene prompts यहाँ दिखाई देंगे।</div>
</main>

<script>
const phases = [
"Opening: establish the ancient world and its mystery",
"Discovery: reveal a danger and introduce the central conflict",
"Rising tension: the hero discovers clues and faces obstacles",
"First confrontation: a powerful enemy interrupts the mission",
"Emotional turning point: a secret, loss or betrayal changes everything",
"Preparation: the hero gathers courage and prepares for the final challenge",
"Climax: a spectacular battle decides the kingdom's fate",
"Resolution: show the consequences and a memorable final image"
];


function makePrompt(i,total,title,story,character,format,hero,continuity){
  const phaseIndex = Math.min(
    phases.length-1,
    Math.floor(i/phases.length)
  );

  const shotTypes = [
    "wide establishing shot",
    "slow cinematic push-in",
    "tracking shot following the subject",
    "low-angle heroic shot",
    "close-up showing emotion",
    "smooth aerial camera movement",
    "dynamic action shot",
    "slow pull-back final shot"
  ];

  
const action = [
  "SCENE 1: Establish the ancient kingdom at dawn. Show its magnificent castles, misty mountains and peaceful people. Foreshadow a mysterious danger.",
  "SCENE 2: Deep beneath a mountain, the ancient black dragon awakens. Its glowing blue eyes open in darkness as stones begin to shake.",
  "SCENE 3: The dragon emerges from the mountain. Villagers see its enormous wings silhouetted against the sky and flee in panic.",
  "SCENE 4: Introduce the young warrior. Show the warrior discovering an ancient symbol that connects the dragon to the kingdom's forgotten history.",
  "SCENE 5: The warrior visits an abandoned temple and finds an old prophecy. A hidden enemy watches from the shadows.",
  "SCENE 6: A trusted ally secretly betrays the warrior by revealing the kingdom's defensive plan to the enemy.",
  "SCENE 7: The dragon attacks the outer fortress. Soldiers defend the gates while the warrior leads civilians to safety.",
  "SCENE 8: The warrior discovers that the dragon is guarding something rather than attacking without reason. The mystery deepens.",
  "SCENE 9: The enemy captures the royal stronghold and frames the warrior for the kingdom's destruction.",
  "SCENE 10: Forced to escape, the warrior crosses a dangerous ravine while enemy riders pursue closely behind.",
  "SCENE 11: In a hidden cave, the warrior finds an ancient artifact that can reveal the dragon's true purpose.",
  "SCENE 12: The warrior uses the artifact and sees a vision of the dragon protecting the kingdom from a greater evil.",
  "SCENE 13: The warrior returns to the ruined village and helps survivors rebuild their courage.",
  "SCENE 14: The dragon senses the artifact and approaches the warrior. Both remain cautious during their first direct encounter.",
  "SCENE 15: The warrior lowers the sword and offers peace. The dragon reveals a shared threat through a powerful vision.",
  "SCENE 16: The traitor returns with enemy forces and steals the artifact, triggering a desperate chase.",
  "SCENE 17: The warrior and dragon pursue the enemy through a storm over towering mountains.",
  "SCENE 18: The enemy activates an ancient weapon that begins draining the kingdom's magical energy.",
  "SCENE 19: The warrior rallies the surviving defenders while the dragon prepares to confront the weapon.",
  "SCENE 20: The final battle begins outside the capital. The dragon clashes with enemy beasts as the warrior fights toward the control chamber.",
  "SCENE 21: The warrior confronts the traitor and demands the truth behind the betrayal.",
  "SCENE 22: The traitor reveals the enemy's plan but is unwilling to surrender the weapon.",
  "SCENE 23: The warrior defeats the traitor in a dramatic duel and recovers the stolen artifact.",
  "SCENE 24: The dragon is wounded while protecting the city. The warrior must choose between pursuing the enemy and saving the dragon.",
  "SCENE 25: The warrior chooses to save the dragon, proving that trust matters more than revenge.",
  "SCENE 26: Together, the warrior and dragon attack the ancient weapon from opposite sides.",
  "SCENE 27: The enemy unleashes a final burst of dark energy, threatening to destroy the capital.",
  "SCENE 28: The warrior uses the artifact to expose the weapon's weakness while the dragon gathers its remaining strength.",
  "SCENE 29: The dragon releases a focused stream of blue fire into the weapon's core. The warrior completes the ritual.",
  "SCENE 30: The ancient weapon collapses in a spectacular burst of light, ending the immediate threat.",
  "SCENE 31: The enemy army retreats as the kingdom's defenders reclaim the capital.",
  "SCENE 32: The warrior helps the surviving people reunite with their families amid the ruins.",
  "SCENE 33: The dragon rests on a mountain ridge while healers and villagers watch from a respectful distance.",
  "SCENE 34: The kingdom honors the warrior for choosing courage, compassion and loyalty over revenge.",
  "SCENE 35: The warrior returns the artifact to the ancient temple so its power cannot be misused again.",
  "SCENE 36: The dragon spreads its enormous wings and flies above the restored kingdom at sunset.",
  "SCENE 37: The warrior looks toward the distant mountains, remembering the allies lost during the conflict.",
  "SCENE 38: A former enemy offers a fragile peace, hinting that rebuilding trust will take time.",
  "SCENE 39: The kingdom celebrates its survival as the dragon circles above the castle one final time.",
  "SCENE 40: End on a majestic wide shot of the dragon and kingdom beneath a glowing sunset, with a subtle hint of a new mystery."
];
  
  return `MOVIE: ${title}
SCENE: ${i+1} of ${total}
STORY: ${story}
STORY PHASE: ${phases[phaseIndex]}
MAIN CHARACTER — KEEP IDENTICAL: ${character}
SECOND CHARACTER — KEEP IDENTICAL: ${hero || "No second character specified"}
CONTINUITY NOTES: ${continuity || "Maintain visual and story continuity"}

SCENE ACTION: ${action[i % action.length]}

CAMERA: ${shotTypes[i%shotTypes.length]}
VISUAL STYLE: Photorealistic cinematic fantasy, detailed textures, dramatic lighting, volumetric fog, realistic scale, professional film color grading.
MOTION: Natural continuous movement, coherent anatomy, realistic physics, stable background.
CONTINUITY: Preserve all character faces, scales, eyes, horns, wings, proportions, colors, scars, costumes and props. Continue the previous scene logically.
FORMAT: ${format}
NEGATIVE PROMPT: flicker, morphing, inconsistent character design, extra limbs, duplicated subjects, distorted anatomy, jitter, blurry frames, random text, watermark.`;
}


let allPrompts = [];


document.getElementById("generate").onclick = () => {
  const title = document.getElementById("title").value.trim();
  const story = document.getElementById("story").value.trim();
  const character = document.getElementById("character").value.trim();
  const hero = document.getElementById("hero").value.trim();
  const continuity = document.getElementById("continuity").value.trim();
  const count = Number(document.getElementById("count").value);
  const format = document.getElementById("format").value;
  const output = document.getElementById("output");

  if (!title || !story || !character) {
    output.textContent =
      "कृपया Movie का नाम, कहानी और मुख्य किरदार का विवरण भरें।";
    return;
  }

  allPrompts = [];

  for (let i = 0; i < count; i++) {
    allPrompts.push(
      makePrompt(i, count, title, story, character, format, hero, continuity)
    );
  }

  output.textContent = allPrompts.join(
    "\n\n" + "=".repeat(36) + "\n\n"
  );
};


document.getElementById("copy").onclick = async () => {
  if (!allPrompts.length) {
    alert("पहले पूरी फिल्म के Scene Prompts बनाएँ।");
    return;
  }
  const text = allPrompts.join("\n\n" + "=".repeat(36) + "\n\n");
  try {
    await navigator.clipboard.writeText(text);
    alert("सभी scene prompts copy हो गए!");
  } catch(e) {
    alert("Copy नहीं हुआ। Prompts को दबाकर रखें और Copy चुनें।");
  }
};

document.getElementById("download").onclick = () => {
  if (!allPrompts.length) {
    alert("पहले पूरी फिल्म के Scene Prompts बनाएँ।");
    return;
  }
  const text = allPrompts.join("\n\n" + "=".repeat(36) + "\n\n");
  const blob = new Blob([text],{type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "surya-ai-movie-prompts.txt";
  a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
